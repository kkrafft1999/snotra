name: Release

# Baut die Distributables auf einem Tag-Push (vX.Y.Z) und haengt sie an das
# zugehoerige GitHub-Release. Die Version kommt aus dem Tag bzw. package.json
# (Single Source of Truth) — die Pipeline baut nur, sie taggt nicht.
#
# Signing (#662): the macOS app and its DMG are signed with a Developer ID,
# notarised and stapled; the secrets are listed at the build-macos job.
# Windows stays unsigned (SmartScreen may warn, deferred in #19). Linux needs
# no signature.
#
# Test-Gate: Vor den Build-Jobs laeuft die Test-Suite aus ci.yml (macOS,
# Windows, Linux). Schlaegt sie fehl, wird weder gebaut noch veroeffentlicht
# (#70).
#
# Tag check (#570): before anything else, a release tag has to name exactly
# the version in package.json and point at a commit on main. A release is
# served to every running installation as "latest"; a tag on the wrong commit
# would be offered to all of them, and on Windows and Linux installed and
# offered again after the restart. Prerelease tags (with a "-") are never
# served as "latest" and are exempt, so a test build can come from a branch.

on:
  push:
    tags:
      - 'v*'

# Least privilege (#71): Workflow-Default ist nur Lesen. Die Build-Jobs fuehren
# npm-Installationsskripte aus und brauchen kein Schreibrecht; nur der
# Publish-Job haengt Artefakte an das Release und bekommt 'contents: write'.
# Alle Actions sind auf Commit-SHAs gepinnt (Tag als Kommentar), Dependabot
# haelt sie ueber .github/dependabot.yml aktuell.
permissions:
  contents: read

jobs:
  verify-tag:
    name: Tag matches package.json and main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          if [[ "$tag" == *-* ]]; then
            echo "Prerelease tag $GITHUB_REF_NAME: not served as latest, not checked."
            exit 0
          fi
          version="$(node -p "require('./package.json').version")"
          if [[ "$tag" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in package.json ($version)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches package.json and is on main."

  test:
    name: Test-Gate
    needs: verify-tag
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-macos:
    name: Build macOS (arm64)
    needs: test
    runs-on: macos-14 # Apple Silicon -> passt zu --arch arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Electron's binary comes separately since Electron 44 (#666).
      - name: Download the Electron binary
        run: node scripts/install-electron.js
      # Developer ID signing (#662). The certificate goes into a throwaway
      # keychain that exists for this job only; the App Store Connect key for
      # notarytool into RUNNER_TEMP. Both are removed in the last step, also
      # when the job fails. Secrets:
      #   MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD  Developer ID Application
      #   APPLE_API_KEY_P8_BASE64, APPLE_API_KEY_ID, APPLE_API_ISSUER
      #   APPLE_TEAM_ID                                 expected team in the signature
      # The intermediate "Developer ID - G2" is fetched from Apple and pinned
      # by its SHA-256, since the runner image does not promise to carry it.
      - name: Set up the signing keychain
        shell: bash
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          umask 077
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          echo "F16CD3C54C7F83CEA4BF1A3E6A0819C8AAA8E4A1528FD144715F350643D2DF3A  $RUNNER_TEMP/DeveloperIDG2CA.cer" \
            | tr 'A-F' 'a-f' | shasum -a 256 -c -
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -f pkcs12 \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/developer-id.p12"
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          if [[ "$identity" != *"($APPLE_TEAM_ID)" ]]; then
            echo "::error::No valid Developer ID Application identity for team $APPLE_TEAM_ID in the keychain."
            exit 1
          fi
          {
            echo "SNOTRA_MACOS_SIGN_IDENTITY=$identity"
            echo "SNOTRA_MACOS_KEYCHAIN=$keychain"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8"
          } >> "$GITHUB_ENV"
          echo "Signing as: $identity"
      # 'npm run make' scheitert gelegentlich beim DMG-Schritt an einem flaky
      # 'hdiutil detach' (appdmg-Race: Volume ist beim Unmount schon weg ->
      # "No such file or directory"). Kein Config-Bug (identische Config baute
      # fruehere Releases erfolgreich), daher hier gegen die Flakiness haerten:
      # bis zu 3 Versuche, dazwischen Alt-Volumes zwangsweise loesen und
      # partielle Outputs entfernen.
      # The afterComplete hook (scripts/sign-macos.js) signs the app with the
      # identity from the step above, notarises it and staples the ticket.
      - name: Build distributables (retry flaky hdiutil detach)
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -uo pipefail
          attempts=3
          for i in $(seq 1 "$attempts"); do
            echo "::group::npm run make (Versuch $i/$attempts)"
            if npm run make; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "make-Versuch $i fehlgeschlagen; raeume vor Retry auf"
            for vol in "/Volumes/Snotra AI"*; do
              [ -d "$vol" ] && hdiutil detach "$vol" -force || true
            done
            rm -rf out/make || true
          done
          echo "npm run make nach $attempts Versuchen fehlgeschlagen" >&2
          exit 1
      - name: Collect DMG
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          dmg="$(ls out/make/*.dmg | head -1)"
          cp "$dmg" "dist/Snotra-AI-${version}-mac-arm64.dmg"
      # The DMG is the container users download: sign it, notarise it on its
      # own and staple the ticket, so Gatekeeper accepts it even offline.
      - name: Sign, notarise and staple the DMG
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          dmg="$(ls dist/*.dmg)"
          codesign --sign "$SNOTRA_MACOS_SIGN_IDENTITY" --keychain "$SNOTRA_MACOS_KEYCHAIN" --timestamp "$dmg"
          result="$(xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" --wait --output-format json)"
          echo "$result"
          id="$(node -p "JSON.parse(process.argv[1]).id" "$result")"
          status="$(node -p "JSON.parse(process.argv[1]).status" "$result")"
          if [[ "$status" != "Accepted" ]]; then
            xcrun notarytool log "$id" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" || true
            echo "::error::Notarisation of the DMG ended with status $status (submission $id)."
            exit 1
          fi
          xcrun stapler staple "$dmg"
      # Gate (#662): a release only goes out when Gatekeeper accepts both the
      # app and the DMG, both carry a stapled ticket, and the signature names
      # the expected team.
      - name: Verify signatures and notarisation
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          app="$(ls -d out/*-darwin-arm64/*.app | head -1)"
          dmg="$(ls dist/*.dmg)"
          # spctl reports "override=security disabled" instead of a verdict when
          # Gatekeeper is switched off on the runner; only a real verdict counts.
          assess() {
            local out
            out="$(spctl --assess -vvv "$@" 2>&1)" || { echo "$out"; return 1; }
            echo "$out"
            if [[ "$out" == *"security disabled"* ]]; then
              echo "::warning::Gatekeeper is disabled on this runner; relying on codesign and stapler."
            elif [[ "$out" != *"source=Notarized Developer ID"* ]]; then
              echo "::error::Gatekeeper accepts $* but not as notarised Developer ID."
              return 1
            fi
          }
          codesign --verify --deep --strict --verbose=2 "$app"
          details="$(codesign -dvv "$app" 2>&1)"
          grep -qx "TeamIdentifier=$APPLE_TEAM_ID" <<< "$details" \
            || { echo "::error::The app is not signed by team $APPLE_TEAM_ID."; exit 1; }
          grep -q 'flags=.*(runtime)' <<< "$details" \
            || { echo "::error::The app is signed without the hardened runtime."; exit 1; }
          assess --type execute "$app"
          xcrun stapler validate "$app"
          codesign --verify --verbose=2 "$dmg"
          assess --type open --context context:primary-signature "$dmg"
          xcrun stapler validate "$dmg"
          shasum -a 256 "$dmg"
      # Paketinhalt gegen die Allowlist aus package.json pruefen (#72): keine
      # .claude/, docs/, test/ usw. im ausgelieferten app.asar.
      - name: Check package contents (allowlist)
        run: node scripts/check-asar-contents.js
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos
          path: dist/*
      - name: Remove the signing keychain and the API key
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/developer-id.p12"

  build-windows:
    name: Build Windows (x64)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Electron's binary comes separately since Electron 44 (#666).
      - name: Download the Electron binary
        run: node scripts/install-electron.js
      - run: npm run package:win
      - name: Check package contents (allowlist)
        run: node scripts/check-asar-contents.js
      - name: Zip package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "$env:GITHUB_REF_NAME".TrimStart('v')
          $dir = (Get-ChildItem -Path out -Directory -Filter '*-win32-x64' | Select-Object -First 1).FullName
          if (-not $dir) { throw 'Kein *-win32-x64 Package-Verzeichnis gefunden.' }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$dir/*" -DestinationPath "dist/Snotra-AI-$version-win-x64.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: dist/*

  # Linux (#100): ein einziger 'make'-Lauf liefert alle drei Artefakte — .deb
  # und .AppImage aus den Makern, dazu das entpackte Package-Verzeichnis, das
  # wir als Tarball anhaengen. Das .deb ist der empfohlene Weg, weil nur dort
  # das Paketieren das Setuid-Bit auf 'chrome-sandbox' setzt (4755). AppImage
  # und Tarball haben das nicht und fallen auf den User-Namespace-Sandbox
  # zurueck; beim Tarball laesst sich das Bit nachtraeglich setzen, im AppImage
  # nicht (read-only und nosuid eingehaengt) — siehe README.
  build-linux:
    name: Build Linux (x64)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      # maker-deb ruft 'dpkg' und 'fakeroot' auf, der AppImage-Maker
      # 'mksquashfs'; alle drei werden von Forge vorab geprueft. Auf dem
      # Runner-Image sind sie vorhanden; der Schritt macht die Abhaengigkeit
      # explizit, damit ein Image-Umbau die Maker nicht still kippt.
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg fakeroot squashfs-tools
      - run: npm ci
      # Electron's binary comes separately since Electron 44 (#666).
      - name: Download the Electron binary
        run: node scripts/install-electron.js
      - run: npm run make:linux
      - name: Check package contents (allowlist)
        run: node scripts/check-asar-contents.js
      - name: Collect deb, AppImage and tarball
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          deb="$(ls out/make/deb/x64/*.deb | head -1)"
          cp "$deb" "dist/Snotra-AI-${version}-linux-x64.deb"
          appimage="$(ls out/make/AppImage/x64/*.AppImage | head -1)"
          cp "$appimage" "dist/Snotra-AI-${version}-linux-x64.AppImage"
          # Bewusst tar.gz statt zip: ZIP erhaelt das Executable-Bit nicht.
          # Das Verzeichnis wird vorher umbenannt, damit im Archiv kein
          # Ordnername mit Leerzeichen landet.
          dir="$(ls -d out/*-linux-x64 | head -1)"
          stage="snotra-ai-${version}-linux-x64"
          mv "$dir" "out/${stage}"
          tar -czf "dist/Snotra-AI-${version}-linux-x64.tar.gz" -C out "${stage}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux
          path: dist/*

  release:
    name: Publish release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write # einziger Job, der ins Repo (Release-Assets) schreibt
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Attach artifacts to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/**/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          # Tags mit SemVer-Suffix (v1.6.0-rc.1, v1.5.1-debtest) sind Vorab-
          # Versionen und werden als Prerelease veroeffentlicht. Die App fragt
          # GET /releases/latest ab, und GitHub liefert dort weder Drafts noch
          # Prereleases — ein Testbuild wird laufenden Installationen also nie
          # als Update angeboten (src/main/services/update-service.js).
          prerelease: ${{ contains(github.ref_name, '-') }}
