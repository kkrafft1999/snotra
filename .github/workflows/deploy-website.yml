name: Deploy Website

# Veroeffentlicht die Landingpage aus website/ auf Firebase Hosting
# (snotra-ai.dev, Issue #21). Laeuft nur, wenn sich an der Seite selbst oder an
# der Hosting-Konfiguration etwas geaendert hat — ein Commit am App-Code loest
# kein Deploy aus.
#
# Voraussetzungen, die einmalig von Hand kommen muessen:
#   1. Firebase-Projekt anlegen und die Projekt-ID in .firebaserc eintragen.
#   2. Service-Account-Schluessel (JSON) als Repository-Secret
#      FIREBASE_SERVICE_ACCOUNT hinterlegen.
#      Rolle: "Firebase Hosting Admin" genuegt.
#   3. Domain snotra-ai.dev in der Firebase-Konsole verbinden und die dort
#      genannten DNS-Records bei ClouDNS setzen.
#
# Die Installationspakete bleiben bei GitHub Releases; das Hosting liefert nur
# die Seite aus (Spark-Plan, ~360 MB Transfer pro Tag).

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    name: Auf Firebase Hosting veroeffentlichen
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Projekt-ID aus .firebaserc lesen
        id: firebase
        run: |
          # Kein require(): .firebaserc traegt keine .json-Endung, Node liest es
          # sonst als JavaScript und stirbt an "Unexpected token ':'".
          PROJEKT=$(jq -r '.projects.default' .firebaserc)
          if [ -z "$PROJEKT" ] || [ "$PROJEKT" = "null" ] || [ "$PROJEKT" = "FIREBASE-PROJEKT-ID-EINTRAGEN" ]; then
            echo "::error::Keine brauchbare Projekt-ID in .firebaserc (gelesen: '$PROJEKT')."
            exit 1
          fi
          echo "projekt=$PROJEKT" >> "$GITHUB_OUTPUT"

      - name: Cache-Buster aus dem Dateiinhalt setzen
        run: |
          # styles.css und app.js liegen 24 h im Browser-Cache (firebase.json).
          # app.js schreibt beim Start alle data-i18n-Texte neu — ein alter
          # Stand aus dem Cache setzt also den alten Text zurueck in die frisch
          # geladene Seite. Der Hash im Query-String bricht das auf: gleiche
          # Datei = gleiche URL = Cache greift weiter, geaenderte Datei = neue
          # URL = der Browser holt sie sofort.
          CSS=$(sha1sum website/styles.css | cut -c1-8)
          JS=$(sha1sum website/app.js | cut -c1-8)
          sed -i "s/styles\.css?v=dev/styles.css?v=$CSS/g; s/app\.js?v=dev/app.js?v=$JS/g" website/*.html

          # Eine Einbindung ohne Platzhalter faellt sonst still auf den alten
          # 24-h-Cache zurueck und niemand merkt es.
          if grep -nE '(src|href)="(app\.js|styles\.css)"' website/*.html; then
            echo "::error::Einbindung ohne ?v=dev gefunden — Cache-Buster greift dort nicht."
            exit 1
          fi
          if grep -n '?v=dev' website/*.html; then
            echo "::error::Platzhalter ?v=dev wurde nicht ersetzt."
            exit 1
          fi
          grep -hoE '(app\.js|styles\.css)\?v=[0-9a-f]+' website/index.html | sort -u

      - name: Auf Firebase Hosting deployen
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ steps.firebase.outputs.projekt }}
          channelId: live
