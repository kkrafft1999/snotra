name: CI

# Fuehrt die Test-Suite (node --test) bei Pull Requests und Pushes auf main aus.
# Laeuft auf macOS, Windows und Linux, weil einzelne Tests plattformspezifische
# Pfad- und Packaging-Regeln pruefen und fuer alle drei Plattformen gebaut wird
# (Issue #100). Wird ausserdem von release.yml als Test-Gate vor den Build-Jobs
# aufgerufen (workflow_call), damit ein Release-Tag nie Binaerdateien aus einem
# roten Stand erzeugt (Issue #70).
#
# Neben der Unit-Suite laeuft im selben Job auch der Electron-Smoke-Test
# (test:e2e, e2e/smoke.test.mjs) mit, weil er Dinge abdeckt, die node --test
# grundsaetzlich nicht kann: Sanitizing mit dem echten DOMPurify, Layout und
# Fokus in der laufenden App (Issue #237). Linux braucht dafuer einen
# virtuellen Display-Server (Electron startet sonst gar nicht headless).

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-latest]
        # `ubuntu-latest` became Ubuntu 26.04 on 2026-10-20, where the Linux
        # sandbox cannot start (#1204). The runner stays on 24.04 until that is
        # fixed; the matrix value keeps its name, and with it the check name
        # the ruleset requires (#1203).
        include:
          - os: ubuntu-latest
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner || matrix.os }}
    # A green job takes three to five minutes; 20 is a backstop for a hang the
    # per-test limits in package.json cannot reach, not a budget (#997). Without
    # it a stuck e2e step held the required gate for six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Electron 44 fetches its binary on the first require, not on install
      # (#666): fetched here, a network blip is a retried install step instead
      # of a failing test.
      - name: Download the Electron binary
        run: node scripts/install-electron.js
      # The sandbox of shell_execute/run_python (#329) is tested for real on
      # macOS and Linux. Linux needs its three packages, and Ubuntu 24.04
      # restricts the unprivileged user namespaces bubblewrap relies on.
      - name: Sandbox prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Every manual page in English and German, every screenshot motif in its
      # four variants (#1013). Without it, a missing page only fails the tag
      # build in manual.yml; here it is part of the required gate. Node
      # built-ins only, so it needs no npm ci in manual/.
      - name: Manual completeness
        run: node manual/scripts/check-content.mjs
      - run: npm test
        env:
          # A skipped isolation test must not pass for a green one.
          SNOTRA_REQUIRE_SANDBOX: ${{ runner.os != 'Windows' && '1' || '' }}
      - name: Xvfb installieren (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Electron-Smoke-Test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:e2e
      - name: Electron-Smoke-Test
        if: runner.os != 'Linux'
        run: npm run test:e2e
