name: 💡 Feature Request
description: An idea for a new feature, skill or tool.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Which problem / use case is behind this?
      description: Context for why this is needed (see also the vision in the README).
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What could the solution look like?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Chat / providers
        - Workspace tools
        - Skills concept
        - UI / UX
        - Build & release
        - Documentation
        - Other
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / already considered
    validations:
      required: false
