name: 🐛 Bug Report
description: Something does not work as expected.
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A short description of the problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can the bug be reproduced?
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: App version
      placeholder: e.g. 1.0.1 (see Settings › About)
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - Windows
        - Linux
        - Other
    validations:
      required: false

  - type: dropdown
    id: provider
    attributes:
      label: Affected provider (if relevant)
      options:
        - OpenAI
        - Anthropic
        - Google (Gemini)
        - Ollama
        - MLX-LM (local)
        - OpenAI-compatible
        - Not relevant
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Error messages, console output or screenshots, if available.
    validations:
      required: false
