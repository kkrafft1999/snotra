<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1016" viewBox="0 0 1600 1016" role="img" aria-labelledby="title description">
  <title id="title">Snotra Agent — mobile remote: architecture</title>
  <desc id="description">The desktop app with a new remote bridge on top of the application core and the local store, a blind relay in its own Firebase project made of Cloud Functions and a Realtime Database, and the iPhone app in Swift and SwiftUI with its keys in the Secure Enclave. Pairing goes from the desktop screen to the phone camera by QR code or typed key. Messages travel through the relay as encrypted envelopes; the end-to-end encrypted channel runs between the remote bridge and the phone, and the relay cannot read it. One user, at the desk or away from it. Concept of 2026-10-17, revised the same day for SwiftUI and CryptoKit.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5C5C5C"/>
    </marker>
    <marker id="arrow-e2e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F7A4D"/>
    </marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .canvas { fill: #F9F9F9; }
      .page-title { fill: #000000; font-size: 32px; font-weight: 600; }
      .page-sub { fill: #5C5C5C; font-size: 15px; }
      .boundary { fill: none; stroke: #5C5C5C; stroke-width: 1.5; stroke-dasharray: 8 6; }
      .boundary-label { fill: #3D3D3D; font-size: 14px; font-weight: 600; }
      .boundary-tag { fill: #5C5C5C; font-size: 12px; }
      .container { fill: #FFFFFF; stroke: #00759E; stroke-width: 2; }
      .container--new { fill: #FFF6EB; stroke: #B85F00; stroke-width: 2.5; }
      .person { fill: #0B4F6C; }
      .name { fill: #000000; font-size: 18px; font-weight: 600; }
      .tech { fill: #00759E; font-size: 12px; font-weight: 500; }
      .tech--new { fill: #8F4A00; font-size: 12px; font-weight: 500; }
      .desc { fill: #5C5C5C; font-size: 13px; }
      .person-name { fill: #FFFFFF; font-size: 16px; font-weight: 600; text-anchor: middle; }
      .person-sub { fill: #D5E6EE; font-size: 11px; text-anchor: middle; }
      .edge { fill: none; stroke: #5C5C5C; stroke-width: 1.6; }
      .edge--pair { fill: none; stroke: #5C5C5C; stroke-width: 1.6; stroke-dasharray: 3 4; }
      .edge--e2e { fill: none; stroke: #1F7A4D; stroke-width: 3; stroke-dasharray: 10 6; }
      .edge-label { fill: #3D3D3D; font-size: 11.5px; text-anchor: middle; }
      .edge-label--e2e { fill: #1F7A4D; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .label-bg { fill: #F9F9F9; }
      .legend-title { fill: #3D3D3D; font-size: 13px; font-weight: 600; }
      .legend-text { fill: #5C5C5C; font-size: 12px; }
      .stamp { fill: #8A8A8A; font-size: 11px; text-anchor: end; }
    </style>
  </defs>

  <rect class="canvas" width="1600" height="1016"/>

  <!-- Title -->
  <text class="page-title" x="60" y="64">Snotra Agent — mobile remote: architecture</text>
  <text class="page-sub" x="60" y="94">The phone mirrors the desktop's chats through a blind relay. Every chat stays on the desktop. Concept of 2026-10-17, docs/mobile-remote-concept.md.</text>

  <!-- Person -->
  <circle class="person" cx="860" cy="128" r="14"/>
  <rect class="person" x="770" y="140" width="180" height="60" rx="14"/>
  <text class="person-name" x="860" y="166">User</text>
  <text class="person-sub" x="860" y="186">one person — never two</text>
  <path class="edge" d="M 770 178 L 340 240" marker-end="url(#arrow)"/>
  <rect class="label-bg" x="500" y="196" width="90" height="18"/>
  <text class="edge-label" x="545" y="209">at the desk</text>
  <path class="edge" d="M 950 178 L 1320 270" marker-end="url(#arrow)"/>
  <rect class="label-bg" x="1080" y="204" width="130" height="18"/>
  <text class="edge-label" x="1145" y="217">away from the desk</text>

  <!-- Desktop boundary -->
  <rect class="boundary" x="60" y="240" width="560" height="660" rx="10"/>
  <text class="boundary-label" x="80" y="884">Snotra Agent</text>
  <text class="boundary-tag" x="178" y="884">[desktop app · this repository]</text>

  <rect class="container" x="90" y="270" width="500" height="80" rx="8"/>
  <text class="name" x="110" y="297">App window (renderer)</text>
  <text class="tech" x="110" y="316">[Chromium]</text>
  <text class="desc" x="110" y="337">Chats as today; shows the QR code and marks messages from the phone</text>

  <rect class="container--new" x="90" y="380" width="500" height="120" rx="8"/>
  <text class="name" x="110" y="408">Remote bridge</text>
  <text class="tech--new" x="110" y="427">[new · src/main/remote/ · driving adapter]</text>
  <text class="desc" x="110" y="452">Pairing, end-to-end encryption, presence.</text>
  <text class="desc" x="110" y="471">Turns protocol messages into calls on the core, and the</text>
  <text class="desc" x="110" y="490">core's events into display packets for the phone.</text>

  <rect class="container" x="90" y="530" width="500" height="130" rx="8"/>
  <text class="name" x="110" y="558">Application core</text>
  <text class="tech" x="110" y="577">[src/application/]</text>
  <text class="desc" x="110" y="602">Conversation service (#981): runs every turn, stores every chat.</text>
  <text class="desc" x="110" y="621">Approval port per connection; confirmation port (#980).</text>
  <text class="desc" x="110" y="640">The remote side can answer once — it can never loosen a protection.</text>

  <rect class="container" x="90" y="690" width="500" height="110" rx="8"/>
  <text class="name" x="110" y="718">Local store</text>
  <text class="tech" x="110" y="737">[JSON in userData · safeStorage]</text>
  <text class="desc" x="110" y="762">Every chat stays here (chat-history.json).</text>
  <text class="desc" x="110" y="781">Desktop key, the phone's public key, the workspaces opened for it.</text>

  <path class="edge" d="M 340 500 V 528" marker-end="url(#arrow)"/>
  <path class="edge" d="M 340 660 V 688" marker-end="url(#arrow)"/>

  <!-- Relay boundary -->
  <rect class="boundary" x="680" y="330" width="360" height="430" rx="10"/>
  <text class="boundary-label" x="700" y="730">Firebase project snotra-relay</text>
  <text class="boundary-tag" x="700" y="748">[blind relay · not the website's project]</text>

  <rect class="container--new" x="710" y="360" width="300" height="130" rx="8"/>
  <text class="name" x="728" y="388">Cloud Functions</text>
  <text class="tech--new" x="728" y="407">[pairing · tokens · clean-up]</text>
  <text class="desc" x="728" y="432">Mint a token per channel and role,</text>
  <text class="desc" x="728" y="451">admit exactly two keys, delete</text>
  <text class="desc" x="728" y="470">envelopes after ten minutes.</text>

  <rect class="container--new" x="710" y="520" width="300" height="180" rx="8"/>
  <text class="name" x="728" y="548">Realtime Database</text>
  <text class="tech--new" x="728" y="567">[mailbox · presence]</text>
  <text class="desc" x="728" y="592">/channels/{id}/to-phone</text>
  <text class="desc" x="728" y="611">/channels/{id}/to-desktop</text>
  <text class="desc" x="728" y="636">{ nonce, ciphertext } — nothing else</text>
  <text class="desc" x="728" y="655">Presence through onDisconnect.</text>
  <text class="desc" x="728" y="680">Sees: timing, sizes, IP addresses.</text>

  <!-- Phone -->
  <rect class="container--new" x="1130" y="270" width="410" height="340" rx="8"/>
  <text class="name" x="1150" y="298">Snotra mobile</text>
  <text class="tech--new" x="1150" y="317">[Swift · SwiftUI · repository snotra-mobile · built later]</text>
  <text class="desc" x="1150" y="347">Workspaces of the desktop; switch the active one.</text>
  <text class="desc" x="1150" y="367">Chats of a workspace; switch between them.</text>
  <text class="desc" x="1150" y="387">Follow a chat live, write, start a chat, stop a run.</text>
  <text class="desc" x="1150" y="407">Approvals: allow once or deny.</text>
  <text class="desc" x="1150" y="437">Holds a chat in memory only — nothing on disk,</text>
  <text class="desc" x="1150" y="457">nothing in a cache, nothing in a notification.</text>
  <text class="desc" x="1150" y="487">Unlocks with Face ID, Touch ID or the device code.</text>

  <rect class="container" x="1130" y="640" width="410" height="90" rx="8"/>
  <text class="name" x="1150" y="668">Secure key store</text>
  <text class="tech" x="1150" y="687">[Secure Enclave · Keychain, this device only]</text>
  <text class="desc" x="1150" y="710">Own keys, the desktop's public keys — nothing else.</text>
  <path class="edge" d="M 1335 610 V 638" marker-end="url(#arrow)"/>

  <!-- Pairing -->
  <path class="edge--pair" d="M 590 300 H 1128" marker-end="url(#arrow)"/>
  <rect class="label-bg" x="636" y="278" width="448" height="18"/>
  <text class="edge-label" x="860" y="291">Pairing: QR code or typed key — one use, five minutes, confirmed at the desktop</text>

  <!-- Transport through the relay -->
  <path class="edge" d="M 590 410 H 708" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="edge-label" x="650" y="402">channel · token</text>
  <path class="edge" d="M 590 452 H 690 V 610 H 708" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="edge-label" x="640" y="444">envelopes</text>
  <path class="edge" d="M 1130 420 H 1012" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="edge-label" x="1071" y="412">pairing · token</text>
  <path class="edge" d="M 1130 540 H 1060 V 620 H 1012" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="edge-label" x="1095" y="532">envelopes</text>

  <!-- End-to-end channel -->
  <path class="edge--e2e" d="M 590 484 H 650 V 860 H 1080 V 590 H 1128" marker-start="url(#arrow-e2e)" marker-end="url(#arrow-e2e)"/>
  <rect class="label-bg" x="660" y="836" width="410" height="18"/>
  <text class="edge-label--e2e" x="865" y="850">End-to-end encrypted — the relay cannot read it</text>
  <text class="edge-label" x="865" y="880">P-256 + X25519 · ChaCha20-Poly1305 · CryptoKit / Node crypto</text>

  <!-- Legend -->
  <text class="legend-title" x="60" y="938">Legend</text>
  <rect class="container" x="60" y="952" width="28" height="18" rx="4"/>
  <text class="legend-text" x="98" y="966">exists today (changes in #981, #980)</text>
  <rect class="container--new" x="330" y="952" width="28" height="18" rx="4"/>
  <text class="legend-text" x="368" y="966">new in this concept</text>
  <path class="edge--e2e" d="M 520 961 H 560"/>
  <text class="legend-text" x="570" y="966">end-to-end encrypted channel</text>
  <path class="edge" d="M 760 961 H 800" marker-end="url(#arrow)"/>
  <text class="legend-text" x="810" y="966">transport through the relay</text>
  <path class="edge--pair" d="M 990 961 H 1030" marker-end="url(#arrow)"/>
  <text class="legend-text" x="1040" y="966">pairing, from screen to camera</text>

  <text class="stamp" x="1540" y="984">Created 2026-10-17 · Claude Opus 5.5 · Reasoning effort: high</text>
  <text class="stamp" x="1540" y="1000">Revised 2026-10-17 · Claude Opus 5.5 · Reasoning effort: high</text>
</svg>
